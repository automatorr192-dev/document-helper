name: Pages

# Запускается только руками. Автозапуск по пушу включим, когда решим публиковать
# мини-апп: до этого Pages в репозитории выключен и сборка просто падает.
# Чтобы включить: settings -> Pages -> Source: GitHub Actions, потом вернуть сюда
#   push:
#     branches: [main]
#     paths: ["webapp/**", ".github/workflows/pages.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: webapp
      - id: deploy
        uses: actions/deploy-pages@v4
